<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agregar Autor</title>
  <!-- Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white text-center">
        <h4>Agregar Autor</h4>
      </div>
      <div class="card-body">
        <form action="../controladores/agregar_autor.ctr.php" method="POST">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del Autor</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
          </div>

          <div class="mb-3">
            <label for="biografia" class="form-label">Biografía</label>
            <textarea class="form-control" id="biografia" name="biografia" rows="4"></textarea>
          </div>

          <button type="submit" class="btn btn-success w-100">Guardar Autor</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
