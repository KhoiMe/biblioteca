<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agregar Libro</title>
  <!-- Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-header text-center bg-secondary text-white">
        <h4>Agregar Libro</h4>
      </div>
      <div class="card-body">
        <form action="../controladores/agregar_libros.ctr.php" method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="genero" class="form-label">Género</label>
            <input type="text" class="form-control" id="genero" name="genero" required>
          </div>

          <div class="mb-3">
            <label for="categoria" class="form-label">Categoría</label>
            <input type="text" class="form-control" id="categoria" name="categoria" required>
          </div>

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"></textarea>
          </div>

           <div class="mb-3">
            <label for="imagen" class="form-label">portada del libro</label>
            <input type="file" name="imagen" class="form-control" accept="image/*" required>
          </div>

          <div class="mb-3">
            <label for="autor_id" class="form-label">ID del Autor</label>
            <input type="number" class="form-control" id="autor_id" name="autor_id">
          </div>

          <button type="submit" class="btn btn-secondary w-100">Guardar Libro</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
