<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>inicar sesion</title>
    <!-- Favicon-->
    <!-- Bootstrap Icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Merriweather+Sans:400,700" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Merriweather:400,300,300italic,400italic,700,700italic"
        rel="stylesheet" type="text/css" />
    <!-- SimpleLightbox plugin CSS-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/SimpleLightbox/2.1.0/simpleLightbox.min.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="../css/styles.css" rel="stylesheet" />
    
</head>

<body class="masthead">
    <div class="container px-4 px-lg-5 h-100">
        <div class="row gx-4 gx-lg-6 h-75 align-items-center justify-content-center text-center">
            <div class="col-lg-8 align-self-end">
                <h1 class="text-white font-weight-bold">iniciar sesion</h1>

                <br \>
                <br \>

                <!-- Contact-->
                <section id="contact">

                    <div class="row gx-2 gx-lg-5 justify-content-center mb-5">
                        <div class="col-lg-6">
                            <!-- * * * * * * * * * * * * * * *-->
                            <!-- * * SB Forms Contact Form * *-->
                            <!-- * * * * * * * * * * * * * * *-->
                            <!-- This form is pre-integrated with SB Forms.-->
                            <!-- To make this form functional, sign up at-->
                            <!-- https://startbootstrap.com/solution/contact-forms-->
                            <!-- to get an API token!-->
                            <form method="post" action="../controladores/login.php" id="contactForm" data-sb-form-api-token="API_TOKEN">
                                <!-- Email address input-->
                                <div class="form-floating mb-3">
                                    <input class="form-control" id="correo" name="correo" type="email" placeholder="ejemplo@correo.com" required>
                                        
                                    <label for="email">correo</label>
                                    <div class="invalid-feedback" data-sb-feedback="email:required"></div>
                                    <div class="invalid-feedback" data-sb-feedback="email:email">
                                    </div>
                                </div>
                                <div class="form-floating mb-3 position-relative">
                                    <input class="form-control" id="password" name="password" type="password" placeholder="password"
                                        data-sb-validations="required" />
                                    <label for="password">Contraseña</label>
                                    <div class="invalid-feedback" data-sb-feedback="password:required">Se requiere una contraseña.</div>
                                        <button type="button" id="togglePassword" class="btn btn-sm btn-light position-absolute"
                                        style="top: 50%; right: 10px; transform: translateY(-50%); z-index: 5;">
                                        <i id="eyeIcon" class="bi bi-eye"></i>
                                        </button>
                                </div>
                                 <div class="d-grid">
                                        <button class="btn btn-primary btn-xl" onclick="login()">Iniciar Sesión</button>
                                </div>
                                
                                <script>
                                    const togglePassword = document.getElementById('togglePassword');
                                    const passwordInput = document.getElementById('password');
                                    const eyeIcon = document.getElementById('eyeIcon');

                                    togglePassword.addEventListener('click', function () {
                                        const isPassword = passwordInput.type === 'password';
                                        passwordInput.type = isPassword ? 'text' : 'password';
                                        eyeIcon.classList.toggle('bi-eye');
                                        eyeIcon.classList.toggle('bi-eye-slash');
                                    });
                                </script>
                                
                            </form>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>
</body>
